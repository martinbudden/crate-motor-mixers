[package]
name = "motor-mixers"
version = "0.1.4"
edition = "2024"
authors = ["Martin Budden"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/martinbudden/crate-motor-mixers"
description = "A motor mixer library targeted at embedded systems and robotics."
keywords = ["motor", "mixer", "uav", "drone", "no_std"]
categories = [
    "embedded",
    "mathematics",
    "no-std",
    "science::robotics",
    "aerospace::drones",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "katex-header.html"]

[build-dependencies]
rustc_version = "0.4.1"

[features]
default = ["libm"]
#default = ["libm", "serde"]
std = ["vqm/std", "signal-filters/std"]
libm = ["dep:libm", "vqm/libm", "signal-filters/libm", "pidsk-controller/libm"]
serde = ["dep:serde", "postcard"]
no_align = ["vqm/no_align", "signal-filters/no_align"]
simd = ["vqm/simd", "signal-filters/simd"]
# cargo build --features rp2040 
#default = ["rp2040"]
#default = ["stm32"]
#default = ["esp32"]
stm32 = ["embassy-stm32"]
rp2040 = ["embassy-rp"]
esp32 = ["esp-idf-hal"]
embassy-rp = ["dep:embassy-rp"]
embassy-stm32 = ["dep:embassy-stm32"]
#esp32 = ["esp-idf-hal", "esp-hal-embassy", "esp-backtrace", "esp-println"]

[dependencies]
libm = { version = "0.2.16", optional = true }
serde = { version = "1.0.228", default-features = false, features = ["derive"], optional = true }
postcard = { version = "1.1.3", default-features = false, features = ["embedded-io"], optional = true }
vqm = { version = "0.1.8" }
#vqm = { git = "https://github.com/martinbudden/crate-vector-quaternion-matrix" }
#vqm = { path = "../vqm"  }
signal-filters = "0.1.6"
#signal-filters = { git = "https://github.com/martinbudden/crate-signal-filters" }
#signal-filters = { path = "../signal-filters" }
pidsk-controller = "0.1.5"
#pidsk-controller = { path = "../pidsk-controller" }
# Use embedded-hal for I2C/SPI traits
#embedded-hal = "1.0.0"
# Embedded HAL traits (often re-exported by embassy-rp)
#embedded-hal-async = "1.0.0"
# Example: Add a specific sensor driver if needed
# mpu9250 = "0.25.0"
# bmi160 = "0.3.0"
# imu-fusion = "0.2.6"
# imu-calib = "0.1.0"   


# Core Embassy executor and concurrency primitives
#embassy-executor = { version = "0.10", features = ["executor-thread"] }
#embassy-sync = "0.8.0"
#embassy-time = "0.5.1"

# Hardware-specific Embassy HAL (example for Raspberry Pi RP2040)
embassy-rp = { version = "0.10.0", optional = true, features = ["rp2040", "time-driver", "rt"] }
embassy-stm32 = { version = "0.6.0", optional = true, features = ["stm32f407vg", "time-driver-any"] }
# embassy-stm32 = { version = "0.8", optional = true, features = ["stm32f407vg", "time-driver"] }
# embassy-stm32 = { version = "0.5.0", optional = true }
# embassy-esp32 = { version = "0.8", optional = true }
esp-idf-hal = { version = "0.46.2", optional=true }

# For logging and panic handling
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
# STM32/RP2040 logging
defmt = "1.1.0"
defmt-rtt = "1.2.0"
# ESP32 logging
# esp-println = { version = "0.16.1", optional = true, features = ["log"] }
log = "0.4.29"

cfg-if = "1.0.4"   

strum = "0.28.0"
strum_macros = "0.28.0"

# For easy flash access on the RP2040
#embedded-storage = "0.3.1"
num_enum = "0.7.6"


[dev-dependencies]
approx = { version = "0.5.1", default-features = false }

# see https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
opt-level = 0
debug = "line-tables-only"
#split-debuginfo = '...'  # Platform-specific.
strip = "none"
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256
rpath = false

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
opt-level = 3
debug = false
#split-debuginfo = '...'  # Platform-specific.
strip = "none"
debug-assertions = false
overflow-checks = false
lto = false
panic = 'abort'
incremental = false
codegen-units = 16
rpath = false

[profile.release-lto]
inherits = "release"
lto = true
