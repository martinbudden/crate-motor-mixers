[package]
name = "motor-mixers"
version = "0.1.5"
edition = "2024"
authors = ["Martin Budden"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/martinbudden/crate-motor-mixers"
description = "A motor mixer library targeted at embedded systems and robotics."
keywords = ["motor", "mixer", "uav", "drone", "no_std"]
categories = [
    "embedded",
    "mathematics",
    "no-std",
    "science::robotics",
    "aerospace::drones",
]

[package.metadata.docs.rs]
all-features = true

[build-dependencies]
rustc_version = "0.4.1"

[features]
default = ["libm", "std"]
#default = ["libm", "rp2350"]
#default = ["libm", "stm32"]
#default = ["libm", "esp32"]
#default = ["libm", "serde"]
#default = ["libm", "serde", "eight_motors"]

eight_motors = []

# Core backend features declared explicitly
libm = ["dep:libm", "vqm/libm", "signal-filters/libm"]
serde = ["dep:serde", "postcard", "sequential-storage"]
align = ["vqm/align", "signal-filters/align"]
simd = ["vqm/simd", "signal-filters/simd"]

# Target platforms
std = ["embassy-time/std", "embassy-executor/platform-std", "vqm/std", "signal-filters/std"]
rp2040 = ["dep:embassy-rp", "embassy-rp/rp2040"]
rp2350 = ["dep:embassy-rp", "embassy-rp/rp235xa"]
stm32 = ["dep:embassy-stm32", "embassy-stm32/time-driver-any", "embassy-stm32/stm32f407vg"]
esp32 = ["dep:esp-idf-hal"]
#esp32 = ["esp-idf-hal", "esp-hal-embassy", "esp-backtrace", "esp-println"]

[dependencies]

# Core Embassy executor and concurrency primitives
embassy-executor = { version = "0.10.0", default-features = false, features = ["executor-thread"] }
embassy-futures = { version = "0.1.2", default-features = false }
embassy-sync = { version = "0.8.0", default-features = false }
embassy-time = { version = "0.5.1", default-features = false }

# Hardware-specific Embassy HAL
#embassy-rp = { version = "0.10.0", features = ["rp2040", "time-driver", "rt"], optional = true }
embassy-rp = { version = "0.10.0", default-features = false, features = ["time-driver", "critical-section-impl"], optional = true }
embassy-stm32 = { version = "0.6.0", default-features = false, features = ["time-driver-any"], optional = true }
# embassy-esp32 = { version = "0.8", default-features = false, optional = true }
esp-idf-hal = { version = "0.46.2", default-features = false, optional = true }

libm = { version = "0.2.16", optional = true }
serde = { version = "1.0.228", default-features = false, features = ["derive"], optional = true }
postcard = { version = "1.1.3", default-features = false, features = ["embedded-io"], optional = true }
sequential-storage = { version = "7.2.0", features = ["postcard"], optional = true }

vqm = { version = "0.1.14" }
#vqm = { git = "https://github.com/martinbudden/crate-vector-quaternion-matrix" }
#vqm = { path = "../vqm"  }
signal-filters = "0.1.10"
#signal-filters = { git = "https://github.com/martinbudden/crate-signal-filters" }
#signal-filters = { path = "../signal-filters" }
#pidsk-controller = { git = "https://github.com/martinbudden/crate-pid-controller" }
pidsk-controller = "0.1.8"
#pidsk-controller = { path = "../pidsk-controller" }
# Use embedded-hal for I2C/SPI traits
#embedded-hal = "1.0.0"
# Embedded HAL traits (often re-exported by embassy-rp)
#embedded-hal-async = "1.0.0"
# Example: Add a specific sensor driver if needed
# mpu9250 = "0.25.0"
# bmi160 = "0.3.0"
# imu-fusion = "0.2.6"
# imu-calib = "0.1.0"   

# For logging and panic handling
#panic-probe = { version = "1.0.0", features = ["print-defmt"] }
# STM32/RP2040 logging
#defmt = "1.1.0"
#defmt-rtt = "1.2.0"
# ESP32 logging
# esp-println = { version = "0.16.1", features = ["log"], optional = true }
#log = { version = "0.4.32", default-features = false }

#strum = { version = "0.28.0", default-features = false, features = ["derive"] }
#strum_macros = { version = "0.28.0", default-features = false }

# For easy flash access on the RP2040
#embedded-storage = "0.3.1"
#num_enum = { version = "0.7.6", default-features = false }


[dev-dependencies]
approx = { version = "0.5.1", default-features = false }

# see https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
opt-level = 0
debug = "line-tables-only"
#split-debuginfo = '...'  # Platform-specific.
strip = "none"
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256
rpath = false

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
opt-level = 3
debug = false
#split-debuginfo = '...'  # Platform-specific.
strip = "none"
debug-assertions = false
overflow-checks = false
lto = false
panic = 'abort'
incremental = false
codegen-units = 16
rpath = false

[profile.release-lto]
inherits = "release"
lto = true
