[package]
name = "motor-mixers-examples"
version = "0.1.0"
edition = "2024"
authors = ["Martin Budden"]
license = "MIT OR Apache-2.0"

[package.metadata.docs.rs]
all-features = true

[build-dependencies]
rustc_version = "0.4.1"

[features]

default = ["rp235xa"]

eight_motors = ["motor-mixers/eight_motors"]

# stm32 motor timers
motors_t8 = [ "motor-mixers/motors_t8"]
motors_t4_t3 = [ "motor-mixers/motors_t4_t3"]
motors_t3_t2 = [ "motor-mixers/motors_t3_t2"]

rp = ["dep:embassy-rp"] # combined feature for all rp variants
rp2040 = [
    "rp",
    "dep:embassy-rp",
    "dep:cortex-m",
    "dep:cortex-m-rt",
    "cortex-m/critical-section-single-core",
    "embassy-executor/platform-cortex-m",
    "embassy-rp/time-driver",
    "embassy-rp/rp2040",
    "motor-mixers/rp2040"
]
rp235xa = [
    "rp",
    "dep:embassy-rp",
    "dep:cortex-m",
    "dep:cortex-m-rt",
    "cortex-m/critical-section-single-core",
    "embassy-executor/platform-cortex-m",
    "embassy-rp/time-driver",
    "embassy-rp/rp235xa",
    "motor-mixers/rp235xa"
]
rp235xb = [
    "rp",
    "dep:embassy-rp",
    "dep:cortex-m",
    "dep:cortex-m-rt",
    "cortex-m/critical-section-single-core",
    "embassy-executor/platform-cortex-m",
    "embassy-rp/time-driver",
    "embassy-rp/rp235xb",
    "motor-mixers/rp235xb"
]
stm32 = [
    "dep:embassy-stm32",
    "dep:cortex-m",
    "dep:cortex-m-rt",
    "cortex-m/critical-section-single-core",
    "embassy-executor/platform-cortex-m",
    "embassy-stm32/time-driver-tim2",
    "motor-mixers/stm32",
]
stm32f405 = ["embassy-stm32/stm32f405rg"]
esp32 = [
    "dep:esp-hal",
    "esp-hal/esp32s3",
    "motor-mixers/esp32"
]

[dependencies]
motor-mixers = { path = "..", default-features = false}

# Core Embassy executor and concurrency primitives
embassy-executor = { version = "0.10.0", default-features = false, features = ["executor-thread"] }
embassy-time = { version = "0.5.1", default-features = false }
# Hardware-specific Embassy HAL
embassy-rp = { version = "0.10.0", default-features = false, optional = true }
embassy-stm32 = { version = "0.6.0", default-features = false, optional = true }
esp-hal = { version = "1.2.1", default-features = false, optional = true }
cortex-m = { version = "0.7.9", default-features = false, optional = true }
cortex-m-rt = { version = "0.7.6" , default-features = false, optional = true }

fixed = "1.31.0"
defmt = { version = "1.0.1" }
defmt-rtt = "1.3.0"
defmt-test = "0.5.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[[bin]]
name = "bidirectional_pio"
path = "src/bidirectional_pio.rs"

[[bin]]
name = "motor_driver_rp_quad_dshot"
path = "src/motor_driver_rp_quad_dshot.rs"

[[bin]]
name = "motor_driver_rp_quad_pwm"
path = "src/motor_driver_rp_quad_pwm.rs"

[[bin]]
name = "motor_mixer_rp"
path = "src/motor_mixer_rp.rs"

[profile.release]
debug = 2
lto = false
opt-level = 2
