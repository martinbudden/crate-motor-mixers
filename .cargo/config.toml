# Note the RP2350 uses thumbv8m and the RP2040 uses thumbv6m.
# RP2350: thumbv8m.main-none-eabihf (Cortex-M33, ARMv8-M, Hard Float)
# RP2040: thumbv6m-none-eabi (Cortex-M0+, ARMv6-M, Soft Float)

# Configuration for RP2040 (e.g., original Raspberry Pi Pico)
[target.thumbv6m-none-eabi]
runner = "probe-rs run --chip RP2040"
rustflags = [
    "-C", "target-cpu=cortex-m0plus",
    "-C", "link-arg=-Tlink.x", # Ensures the cortex-m-rt linker script is used
]

# Configuration for RP2350 (e.g., Raspberry Pi Pico 2 ARM Core)
[target.thumbv8m.main-none-eabihf]
runner = "probe-rs run --chip RP2350"
rustflags = [
    "-C", "target-cpu=cortex-m33",
    "-C", "link-arg=-Tlink.x", 
]

# Configuration for ESP32 S3
[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor"

[build]
# Optional: Set a default target so you don't have to pass --target to cargo every time
# target = "thumbv8m.main-none-eabihf" 

#[unstable]
#build-std = ["core"]

[alias]
# Run using: 'cargo test-none'
test-none = [ "test", "--no-default-features"]
test-serde = "test --features serde"
test-storage = "test --features storage"
test-8 = [ "test", "--no-default-features", "--features", "eight_motors"]

test-rp235xa = [
    "test",
    "--target", "thumbv8m.main-none-eabihf",
    "--no-default-features",
    "--features",
    "rp235xa"
]

check-none = [ "check", "--no-default-features"]
check-8 = [ "check", "--no-default-features", "--features", "eight_motors"]
check-serde = [ "check", "--no-default-features", "--features", "serde"]
check-storage = [ "check", "--no-default-features", "--features", "storage"]

check-rp235xa = [
    "check",
    "--target", "thumbv8m.main-none-eabihf",
    "--no-default-features",
    "--features",
    "rp235xa"
]

check-stm32 = [
    "check",
    "--target", "thumbv8m.main-none-eabihf",
    "--no-default-features",
    "--features",
    "stm32,stm32f405,motors_t4_t3"
]

check-stm32-t8 = [
    "check",
    "--target", "thumbv8m.main-none-eabihf",
    "--no-default-features",
    "--features",
    "stm32,stm32f405,motors_t8"
]

check-esp32 = [
    "check",
    "--target", "xtensa-esp32s3-none-elf",
    "--no-default-features",
    "--features",
    "esp32"
]

# Continuous Integration
ci = "run --package xtask --bin xtask"
# MSRV
check-msrv = "run --package xtask --bin xtask -- check-msrv"